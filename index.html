<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurant Template Collection — Senthan & Co</title>
<meta name="description" content="Thirteen distinct restaurant HTML templates — dark/light mode, 8-language support, real food photography.">
<style>
  * { box-sizing: border-box; }
  :root { color-scheme: dark; --page:#14110D; --text:#F1EAE0; --muted:#B8AC9C; --card:#1D1912; --border:#33291B; --accent:#D9A85C; --accent-hover:#E8BC78; }
  :root[data-theme="light"] { color-scheme: light; --page:#F6F1E8; --text:#28231C; --muted:#655C50; --card:#FFFDF8; --border:#DCD2C3; --accent:#8B5C20; --accent-hover:#684213; }
  body { background:var(--page); color:var(--text); transition:background .2s ease,color .2s ease; }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  .toolbar { display:flex; justify-content:center; gap:.65rem; margin:0 auto 1.4rem; flex-wrap:wrap; }
  .toolbar select,.toolbar button { border:1px solid var(--border); border-radius:999px; padding:.55rem .85rem; background:var(--card); color:var(--text); font:inherit; font-size:.84rem; cursor:pointer; }
  :root[data-theme="light"] .card { background:var(--card); border-color:var(--border); }
  :root[data-theme="light"] .card-body p, :root[data-theme="light"] header p { color:var(--muted); }
  :root[data-theme="light"] .btn-outline { color:var(--text); border-color:var(--border); }
  :root[data-theme="light"] footer { color:var(--muted); }
  .back-to-top { position:fixed; right:1.25rem; bottom:1.25rem; z-index:90; width:3rem; height:3rem; display:grid; place-items:center; border:0; border-radius:50%; color:#14110D; background:var(--accent); box-shadow:0 8px 24px rgba(0,0,0,.22); cursor:pointer; opacity:0; visibility:hidden; transform:translateY(8px); transition:opacity .2s ease,transform .2s ease,visibility .2s; }
  .back-to-top.is-visible { opacity:1; visibility:visible; transform:translateY(0); }
  .back-to-top:focus-visible { outline:3px solid var(--text); outline-offset:3px; }
  @media (prefers-reduced-motion:reduce) { .back-to-top { transition:none; } }
  body {
    margin: 0; background: #14110D; color: #F1EAE0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 4rem 1.5rem 5rem; }
  header { text-align: center; margin-bottom: 3.5rem; }
  .eyebrow { font-size: .78rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: #D9A85C; margin-bottom: .8rem; display: block; }
  h1 { font-size: clamp(1.9rem, 4.5vw, 2.8rem); margin: 0 0 1rem; font-weight: 700; }
  header p { color: #B8AC9C; max-width: 56ch; margin: 0 auto; font-size: 1.05rem; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.75rem; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: #1D1912; border: 1px solid #33291B; border-radius: 16px; overflow: hidden;
    display: flex; flex-direction: column; transition: transform .2s ease, border-color .2s ease;
  }
  .card:hover { transform: translateY(-4px); border-color: #4A3B24; }
  .card-media { aspect-ratio: 16/10; overflow: hidden; }
  .card-media img { width: 100%; height: 100%; object-fit: cover; display: block; }\n  .card-media iframe { width:100%; height:100%; border:0; display:block; pointer-events:none; }
  .card-body { padding: 1.5rem 1.6rem 1.7rem; display: flex; flex-direction: column; flex: 1; }
  .card-body h2 { font-size: 1.3rem; margin: 0 0 .5rem; }
  .card-body p { color: #B8AC9C; font-size: .94rem; margin: 0 0 1.3rem; flex: 1; }
  .card-tags { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1.2rem; }
  .tag { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: #D9A85C; background: rgba(217,168,92,.12); padding: .3rem .6rem; border-radius: 999px; }
  .card-actions { display: flex; gap: .7rem; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: .4rem; padding: .65rem 1.2rem; border-radius: 999px;
    font-weight: 700; font-size: .88rem; text-decoration: none; transition: all .2s ease;
  }
  .btn-solid { background: #D9A85C; color: #14110D; }
  .btn-solid:hover { background: #E8BC78; }
  .btn-outline { background: transparent; color: #F1EAE0; border: 1px solid #33291B; }
  .btn-outline:hover { border-color: #D9A85C; color: #D9A85C; }
  footer { text-align: center; margin-top: 4rem; color: #7A6E5D; font-size: .88rem; }
  footer a { color: #D9A85C; font-weight: 700; text-decoration: none; }
  :root[data-theme="light"] body { background:var(--page); color:var(--text); }
</style>
</head>
